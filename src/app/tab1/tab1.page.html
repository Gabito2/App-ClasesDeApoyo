<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Agregar Alumno</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Agregar Alumno</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-icon name="person-add"></ion-icon>
      <ion-card-title>Nuevo Alumno</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="floating">Nombre y Apellido</ion-label>
          <ion-input [(ngModel)]="nombre" type="text"></ion-input>
        </ion-item>
        <ion-item class="calendario-item">
          <ion-label position="stacked">Día de pago</ion-label>
          <ion-datetime [value]="fechaSeleccionada" presentation="date" (ionChange)="onFechaChange($event)"
            locale="es-AR" display-timezone="true"></ion-datetime>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Monto mensual ($)</ion-label>
          <ion-input [(ngModel)]="montoMensual" type="number" min="0"></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="full" (click)="guardar()">
        Guardar Alumno
      </ion-button>

      @if (mensaje) {
      <ion-text [color]="mensaje.includes('agregado') ? 'success' : 'danger'">
        <p>{{ mensaje }}</p>
      </ion-text>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
